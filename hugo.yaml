    items:
      - company: "University of Vermont"
        companyUrl: "https://www.uvm.edu/cems/ebe"
        jobs: 
          - name: "Teaching Assistant"
            date: "Jan 2024 - Present"
            content: |
              I have assisted in teaching the following courses (Chronologically):
              - BME 1600: Introduction to BME Design (Spring 2024)
              - BME 2000: Biomechanics & Sensing (Fall 2024)
              - BME 2600: BME Design 1 (Fall 2024)
              - BME 1600: Introduction to BME Design (Spring 2025)
              - EE 2145: Electrical Engineering Concepts (Fall 2025)
              - BME 3000: Systems & Signals (Fall 2025)
              - CMPE 5990: Machine Learning for Engineers (Fall 2025)
              - BME 1605: Introduction to BME Design (Spring 2026)

              Across each of these courses, I have been responsible for leading lectures, grading assignments, holding office hours,
              and ensuring each student receives the support they need.


        
      - company: "Microbiome Metabolic Modeling Lab"
        companyUrl: "https://m-3-lab.github.io/"
        jobs: 
          - name: "Research Assistant"
            date: "Aug 2024 - Present"
            info:
              enable: true
              content: This position was compensated with pay, except 3 semesters of educational credit.
            content: |
              Projects I have contributed to:
              - Predicting Butyrate Production from Microbial Abundance Data using Machine Learning (First project and introduction to Microbiome Engineering)
              - Design of Lab Website
              - Chapter on Spatio-temporal Modeling of Microbial Interactions
              - (ACTIVE) Hybrid Optimization & Deep Learning approach for predicting single microbe phenotypes. (Masters Project)
              - (ACTIVE) Python Package with a new method of simulation microbial community growth. Publication in progress.
              
              Initial work focused on gaining skills and intuition for the field, while currently I am leveraging these skills to re-think
              metabolic modeling. A soon-to-be-released tool, Greedy Interaction FBA, is a novel method of understanding emergent microbial
              community interactions using an iterative approach. Furthermore, metabolic models are inherently prone to error due to the 
              vastness of the networks, the Master's Project seeks to leverage differentiable optimization with deep learning to learn & 
              adjust existing models for. 

              Skills & Tools Used:
              - COBRApy
              - COMETSpy
              - CVXpy
              - Assorted Machine Learning Tools
              - KBase
              - ModelSEED
              - AGORA & Virtual Metabolic Human

      - company: "Center for Biomedical Innovation"
        companyUrl: "https://www.uvm.edu/cems/center-biomedical-innovation"
        jobs:
          - name: "Lab Manager"
            date: "Jan 2025 - May 2026"
            content: |
              I helped facilitate lab resources, organization, event-planning, and communication. I consulted on BME Capstone projects, 
              based in the lab. I aided in training other students and faculty on Soldering and 3D printing. Coordinated Biomedical
              Engineering Society Club events for professional development, community service, & networking

      - company: "Glass Brain Lab"
        companyUrl: "https://www.uvm.edu/cems/center-biomedical-innovation"
        jobs:
          - name: "Research Assistant"
            date: "May 2025 - Present"
            content: |
              I am currently leading the development of the electronic components of a novel multi-sensor system for monitoring elderly 
              individuals' mild cognitive impairment (MCI) in their homes. This is part of a pilot study to create & compile the full suite of
              sensors for wearable and non-wearable monitoring of Activities of Daily Living (ADLs).

      - company: "Special Recreation Association of Central Lake County"
        companyUrl: "https://sraclc.org/"
        jobs: 
          - name: "Inclusion Aide & Support Staff"
            date: "May 2024 - Aug 2024"
            content: |
              I worked as a support staff for individuals of varying ages, cognitive abilities, and physical abilities. I 
              provided support during various summertime activities allowing each individual to have fun, be active, and feel included
              in a safe environment.

              I was recognized for my dedication and excitement in the [Friendly Face Friday Shoutout](https://www.facebook.com/sraclc.org/posts/pfbid0SkgtXEA4UFCVzCEFurMT22JsPtCh7mie2h4GzQ7eRtpe3tY3RJh7NZQCvyHbe9H9l)
 
      - company: "Evolve Senior Living"
        companyUrl: "https://evolvesenior.com/communities/lake-zurich/"
        jobs: 
          - name: "Assisted Living Staff"
            date: "March 2021 - Jan 2025"
            info:
