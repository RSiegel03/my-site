  # About
  about:
    enable: true
    title: "About Me"
    image: "/images/niagara-falls.jpg"
    caption: "My partner and I at Niagara Falls, NY. We love exploring the world and all it has to offer!"
    content: |-
      Since I was young, I have always been good at breaking things (and putting them together) and helping others. 
      My mother hated that I broke everything, but I couldn't help it, I just wanted to know how it worked, how 
      well it worked, and what else it was capable of. I never enjoyed sitting still, and if I wasn't breaking something, 
      I was likely spending time with friends or volunteering both at church or my martial arts studio. Time spent volunteering 
      was when I realized how much our own success relies on others' support and that I never want to stop contributing to this world. 

      My choice to pursue Biomedical Engineering (BME) was decided in middle school. It has been what keeps my mom's heart beating with her
      pacemaker. It was what treated my mom's cancer when I was five. It was the medicine that allowed my mom's patients, veteran's
      at the VA with traumatic injuries, to live without a limb or survive a TBI. Biomedical Engineering was the field that gave me the flexibility
      to explore my world while helping those around me.   

      Curiousity and kindness drive me to learn. I am currently pursuing a Master's degree in Biomedical Engineering at the University of 
      Vermont, where I am focused on machine learning and computational modeling of microbial interactions. 
      
      I never expected to fall in love with coding & computational work, but the mathematical principles
      at the core of it all are too inherently beautiful!

      When I'm not working on research or school, I am usually working on some personal project(s), spending time 
      with my friends and family, or traveling. My personal projects (some shared below) are fun gadgets that I have designed, assembled,
      or somehow worked on to fill my time and continue exploring the world as an engineer. With my family and friends, I am often cooking food, 
      baking (bread, cookies or pies are most common). playing cards, or relaxing at a nice campfire. I love traveling and 
      have been fortunate to travel to 36 U.S. States (Including Alaska, Hawaii, & Puerto Rico) and 2 Countries (Costa Rica & Canada).

      The world is an amazing place, with so many fascinating people to meet and things to learn. I am excited to continue exploring it, and
      make an impact to allow others to explore it as well.



