<div class="publication-container">
  <ul style="list-style-type: none; padding-left: 0;">
    {{ range .Site.Data.publications }}
    <li style="margin-bottom: 1.5rem; padding: 1.5rem; border-left: 4px solid #0E8008; background-color: #f8f9fa; border-radius: 0 8px 8px 0;">
      <h5 style="margin-top: 0; margin-bottom: 0.5rem; color: #262730;">{{ .title }}</h5>
      <p style="margin: 0; font-size: 0.95rem; color: #262730;">
        <strong>{{ .authors }}</strong> ({{ .year }})<br>
        <em>{{ .journal }}</em>
      </p>
      {{ if .doi }}
      <p style="margin: 0.5rem 0 0 0; font-size: 0.9rem;">
        <a href="https://doi.org/{{ .doi }}" target="_blank" rel="noopener noreferrer" style="color: #0E8008; text-decoration: none; font-weight: 500;">
          View DOI &rarr;
        </a>
      </p>
      {{ end }}
    </li>
    {{ end }}
  </ul>
</div>
